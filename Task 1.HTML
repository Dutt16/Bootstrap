</head>
<body>

        <h1>Hello My Fellow Classmates!</h1>

            </div>
            <div class="col" style="border: 1px solid #333; padding: 15px;">
                <h5>Box 2</h5>
                <p>This is the second box.</p>
            </div>
            <div class="col" style="border: 1px solid #333; padding: 15px;">

            </div>
        </div>

    </div>

</html>
